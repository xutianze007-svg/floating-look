<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f4">
<title>A. — One Person, Many Possibilities</title>
<meta name="description" content="An interactive floating edit of everyday accessories. Explore a complete look, from head to toe.">
<link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">
<div class="shell" id="shell">
  <canvas id="gl" class="gl" aria-hidden="true"></canvas>
  <div class="fallback" id="fallback" hidden></div>

  <header class="header">
    <a class="logo" href="#" id="logo" aria-label="A. — home">A.</a>
    <nav class="nav" aria-label="Main">
      <a href="#shop" data-nav="shop">Shop</a>
      <a href="#looks" data-nav="looks">Looks</a>
      <a href="#collections" data-nav="collections">Collections</a>
      <a href="#brand" data-nav="brand">Brand</a>
    </nav>
    <div class="actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.75"/><path d="M15.6 15.6 21 21"/></svg>
      </button>
      <button class="cart-btn" id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
      <button class="signin" id="signinBtn">Sign In</button>
    </div>
  </header>

  <main class="stage" id="stage" aria-label="The look, floating">
    <svg class="leaders" id="leaders" aria-hidden="true"></svg>
    <div class="labels" id="labels"></div>

    <section class="hero ui" id="hero">
      <p class="eyebrow">ACCESSORIES</p>
      <h1 class="title">One Person<br>Many Possibilities</h1>
      <p class="sub">Explore a complete look — from head to toe.<br>Tap any item to see it in action.</p>
      <button class="btn-dark shop-look" id="shopLook">Shop the Look
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 10h12.5M11 5l5 5-5 5"/></svg>
      </button>
    </section>

    <div class="looks ui" id="looks" role="tablist" aria-label="Looks">
      <button class="look is-active" role="tab" aria-selected="true" data-look="city"><img src="assets/avatar-city.jpg" alt=""><span><b>City</b><b>Designer</b></span><i></i></button>
      <button class="look" role="tab" aria-selected="false" data-look="weekend"><img src="assets/avatar-weekend.jpg" alt=""><span><b>Weekend</b><b>Dad</b></span><i></i></button>
      <button class="look" role="tab" aria-selected="false" data-look="festival"><img src="assets/avatar-festival.jpg" alt=""><span><b>Music</b><b>Festival</b></span><i></i></button>
      <button class="look" role="tab" aria-selected="false" data-look="travel"><img src="assets/avatar-travel.jpg" alt=""><span><b>Travel</b><b>Lover</b></span><i></i></button>
    </div>

    <nav class="rail ui" id="rail" aria-label="Shop by body area">
      <button data-cat="head">Head<svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></button>
      <button data-cat="face">Face<svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></button>
      <button data-cat="neck">Neck<svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></button>
      <button data-cat="hands">Hands<svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></button>
      <button data-cat="bag">Bag<svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></button>
      <button data-cat="essentials">Essentials<svg viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></button>
    </nav>

    <article class="story ui" id="story">
      <button class="story-thumb" id="storyThumb" aria-label="Play: The Everyday Bag">
        <img src="assets/story.jpg" alt="">
        <span class="play"><svg viewBox="0 0 12 14" aria-hidden="true"><path d="M1 1.2v11.6L11 7z"/></svg></span>
      </button>
      <div class="story-text">
        <span class="story-index">01 / 08</span>
        <h3>The Everyday Bag</h3>
        <p>Lightweight, versatile, and<br>made for your daily rhythm.</p>
        <button class="btn-line" id="watchVideo"><svg viewBox="0 0 12 14" aria-hidden="true"><path d="M1 1.2v11.6L11 7z"/></svg>Watch the Video</button>
      </div>
    </article>

    <aside class="panel" id="panel" aria-live="polite" hidden></aside>
    <button class="close-focus" id="closeFocus" aria-label="Back to the look" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"/></svg><span>Back to the look</span>
    </button>
  </main>
</div>

<div class="video-pool" id="videoPool" aria-hidden="true"></div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-card" role="dialog" aria-modal="true" aria-label="The Everyday Bag — video">
    <video id="storyVideo" muted playsinline loop preload="none"></video>
    <div class="lightbox-meta"><span>01 / 08</span><strong>The Everyday Bag</strong></div>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close video">×</button>
  </div>
</div>

<aside class="drawer" id="drawer" aria-label="Your cart" hidden>
  <div class="drawer-head"><strong>Your Cart</strong><button id="drawerClose" aria-label="Close cart">×</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
